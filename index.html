<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crumb's Bouquet Rescue</title>
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="920" height="614"></canvas>
    </div>

    <!-- Clear leaderboard if ?reset=1 is in the URL -->
    <script>
        if (new URLSearchParams(window.location.search).get('reset') === '1') {
            localStorage.removeItem('crumbs_leaderboard');
            localStorage.removeItem('crumbs_oops_record');
            window.location.replace(window.location.pathname);
        }
    </script>

    <!-- Game module entry point -->
    <script type="module" src="js/game/game.js"></script>
</body>
</html>
